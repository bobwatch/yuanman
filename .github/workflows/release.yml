name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK_NAME="yuanman-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          echo "APK_FILE=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
          body: |
            Yuanman ${{ github.ref_name }} — polish release

            - Form state survives process death (rememberSaveable everywhere)
            - Discard confirmation when closing the record sheet with unsaved input
            - Overview card is tappable → stats; back button closes search first
            - Snackbars no longer cover the FAB; withdrawal overdraft guard
            - Density-aware chart labels; refined light/dark contrast
            - Next-month button disabled at the current month; stats month is local
