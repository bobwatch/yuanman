name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK_NAME="yuanman-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${APK_NAME}"
          echo "APK_FILE=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
          body: |
            Yuanman ${{ github.ref_name }} — update install fix, budget history, recurring bills polish

            - Fixed: downloaded update APK now installs reliably (FileProvider path + ACTION_VIEW)
            - Budget history page with trend line chart (12 months) and per-month drill-down
            - Recurring bills: create/edit sheet, pause & resume, monthly total card
            - Record sheet opens with the same smooth slide animation as the icon picker
            - Habits / Mood / Mine headers now scroll away with the content
            - Sub-pages open with a cleaner transition (no corner pop)
